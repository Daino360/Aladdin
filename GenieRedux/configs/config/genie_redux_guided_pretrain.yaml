# @package _global_

defaults:
  - default
  - /tokenizer/tokenizer
  - /dynamics/dynamics
  - _self_

model: genie_redux_guided

dynamics:
  use_token: true
  is_guided: true

train:
  dataset_root_dpath: "/equilibrium/students/sdainelli"
  dataset_name: "coinrun_v2.0.0" #"retro_act_v0.0.0"
  # dataset_name: "retro_act_min"
  wandb_name: "genie_redux_guided_pretrain"
  num_train_steps: 25000 #180000
  batch_size: 4
  grad_accum: 3
  n_data_workers: 46
  n_total_samples: 50
  n_envs: 200
  max_valid_size: 50
  use_decoder_loss: false

tokenizer_fpath: ${train.save_root_dpath}/tokenizer/tokenizer/model-150000.pt

eval:
  dataset_root_dpath: ${train.dataset_root_dpath}
  dataset_name: ${train.dataset_name}
  model_fpath: ${train.save_root_dpath}/${model}/${train.wandb_name}/model-150000.pt
  eval_control: "yes"

# guided_genie_config.yaml
defaults:
  - default
  - /tokenizer/tokenizer
  - /dynamics/dynamics
  - _self_

model: genie_redux_guided
mode: eval  # Use eval for inference

optimizer:
  learning_rate: 1e-04
  betas: [0.9, 0.99]
  weight_decay: 1e-04
  max_grad_norm: 10.0

train:
  dataset_root_dpath: "data_generation/datasets"
  dataset_name: "coinrun_v2.0.0"
  wandb_name: "genie_redux_guided"
  batch_size: 4
  grad_accum: 3
  num_train_steps: 150000
  num_frames: 16
  sample_num_frames: 15
  seq_step: 16
  save_root_dpath: "/home/sdainelli/aladdin/neurIPS/checkpoints"
  wandb_mode: "disabled"

eval:
  dataset_root_dpath: "data_generation/datasets"
  dataset_name: "coinrun_v2.0.0"
  model_fpath: "/home/sdainelli/aladdin/neurIPS/checkpoints/GenieRedux_Guided_CoinRun_80mln_v1.0/model.pt"
  batch_size: 1
  num_actions: 5  # CoinRun typically has 5 actions
  num_frames: 16
  inference_steps: 25
  sample_num_frames: 10
  wandb_mode: "disabled"
  eval_control: "yes"

tokenizer_fpath: "/home/sdainelli/aladdin/neurIPS/checkpoints/GenieRedux_Tokenizer_CoinRun_100mln_v1.0/model.pt"

# Tokenizer config
tokenizer:
  dim: 512
  codebook_size: 1024
  image_size: 64
  patch_size: 4
  temporal_patch_size: 1
  num_blocks: 8
  dim_head: 64
  heads: 8
  ff_mult: 4
  vq_loss_weight: 1.0
  recons_loss_weight: 1.0

# Dynamics config for guided model
dynamics:
  dim: 512
  action_dim: 5  # CoinRun actions
  image_size: 64
  patch_size: 4
  temporal_patch_size: 1
  num_blocks: 12
  dim_head: 64
  heads: 8
  ff_mult: 4
  max_seq_len: 4000
  sample_temperature: 1.0
  sample_num_frames: 15